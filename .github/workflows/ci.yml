name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # @claude-browser/shared must build first — the other packages resolve its
      # dist types, and npm's --workspaces order is not topological.
      - name: Build shared
        run: npm run build -w @claude-browser/shared

      - name: Build all packages
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # Hermetic unit suite (192 tests). The real-Chrome integration/soak tests
      # are excluded by vitest.config.ts and gated behind RUN_BROWSER_TESTS=1,
      # so they do not run here.
      - name: Test
        run: npm test
